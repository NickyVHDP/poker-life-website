<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Poker Life</title>
  <desc id="desc">Poker Life wordmark with the tagline Focus, Patience, Profit.</desc>
  <defs>
    <linearGradient id="silver" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset=".42" stop-color="#9eb4cc"/>
      <stop offset="1" stop-color="#dce9f3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff0a4"/>
      <stop offset=".45" stop-color="#e4b440"/>
      <stop offset="1" stop-color="#9e6913"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000814" flood-opacity=".8"/>
    </filter>
  </defs>
  <g text-anchor="middle" filter="url(#soft-shadow)">
    <text x="600" y="116" font-family="Baskerville, Georgia, 'Times New Roman', serif" font-size="104" font-weight="600" letter-spacing="17"><tspan fill="url(#silver)">POKER</tspan><tspan fill="url(#gold)"> LIFE</tspan></text>
    <path d="M148 158H525M675 158H1052" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-width="3"/>
    <path d="M600 137c-16 17-27 29-27 42 0 15 12 28 27 28s27-13 27-28c0-13-11-25-27-42Zm0 62c-6 0-11 4-11 10h22c0-6-5-10-11-10Z" fill="url(#gold)"/>
    <text x="600" y="252" fill="#d8a537" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" letter-spacing="13">FOCUS • PATIENCE • PROFIT</text>
  </g>
</svg>
